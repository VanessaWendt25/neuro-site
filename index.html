<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Neuro Centre</title>

  <link rel="icon" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

  <style>

    :root {
      --bg: #f6f3ee;
      --text: #141414;
      --muted: #7a736a;

      /* GOLD OPTION A */
      --accent: #D6B24A;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Libre Franklin', sans-serif;
      overflow-x: hidden;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: calc(4vh + 10px) 6vw 1.2vh 6vw;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 480px;
      gap: 6vw;
      align-items: start;
    }


    /* LEFT SIDE */

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(95px, 11.5vw, 195px);
      line-height: 0.85;
      margin: 0 0 1.1rem 0;
    }

    .subtitle {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 18px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }


    /* RIGHT SIDE */

    .side {
      width: 480px;
      justify-self: end;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(40px);

      transition:
        opacity 0.8s ease-out,
        transform 0.8s ease-out;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .launch {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 3vw, 54px);
      line-height: 1.02;

      position: relative;
      top: 16px;
      left: 16px;

      margin: 0;
    }


    /* TEMPORARY ATHLONE
       Later replaced by calligraphy no. 5 */

    .city-highlight {
      display: inline-block;

      font-family: 'Playfair Display', serif;
      font-size: 1.45em;
      font-style: italic;
      font-weight: 500;
      line-height: 0.9;

      color: var(--accent);

      margin-top: 10px;
    }


    /* PROFILE */

    .profile {
      display: flex;
      align-items: center;
      gap: 28px;

      position: relative;

      /*
        Lower than before so the bottom
        of the portrait lines up with CENTRE.
      */
      top: 84px;
      left: 16px;
    }

    .profile-photo {
      width: 190px;
      height: 225px;

      object-fit: cover;
      object-position: center top;

      border-radius: 20px;

      flex-shrink: 0;
    }

    .profile-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .profile-name {
      font-family: 'Playfair Display', serif;
      font-size: 29px;
      font-weight: 500;
      line-height: 1.05;

      margin: 0 0 6px 0;
    }

    .profile-role {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.35;

      color: var(--muted);

      margin: 0 0 21px 0;
    }


    /* BUTTON */

    .contact-button {
      display: inline-block;

      padding: 13px 24px;

      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;

      font-family: 'Libre Franklin', sans-serif;
      font-size: 14px;
      font-weight: 500;

      color: #ffffff;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .contact-button:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }


    /* LOWER AREA */

    .lower-block {
      margin-top: 135px;
    }

    .band {
      position: relative;

      left: 50%;
      margin-left: -50vw;

      width: 100vw;

      background: var(--accent);

      padding: 0.95rem 0;
    }

    .band-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 6vw;
    }

    .band-text {
      font-family: 'Playfair Display', serif;

      font-size: clamp(30px, 3vw, 45px);

      font-style: italic;
      font-weight: 500;

      color: #29241f;

      margin: 0;

      line-height: 1.15;
    }

    .locations {
      margin-top: 22px;
    }

    .location-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;

      margin: 0 0 2px 0;
    }

    .place {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 14px;

      color: var(--accent);

      margin: 0;
    }


    /* TABLET */

    @media (max-width: 1100px) {

      .hero {
        grid-template-columns: 1fr 410px;
      }

      .side {
        width: 410px;
      }

      .title {
        font-size: clamp(90px, 10.5vw, 180px);
      }

      .profile {
        top: 74px;
      }

      .profile-photo {
        width: 170px;
        height: 205px;
      }
    }


    /* MOBILE */

    @media (max-width: 900px) {

      .page {
        padding: 5vh 6vw 3vh 6vw;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 1.6rem;
      }

      .side {
        width: 100%;
        max-width: 440px;
        justify-self: start;
      }

      .title {
        font-size: clamp(70px, 18vw, 130px);
      }

      .launch {
        top: 0;
        left: 0;
      }

      .city-highlight {
        font-size: 1.4em;
      }

      .profile {
        top: 22px;
        left: 0;

        gap: 22px;

        align-items: flex-end;
      }

      .profile-photo {
        width: 145px;
        height: 175px;

        border-radius: 18px;
      }

      .profile-name {
        font-size: 27px;
      }

      .profile-role {
        font-size: 14px;
        margin-bottom: 15px;
      }

      .contact-button {
        padding: 11px 19px;
        font-size: 13px;
      }

      .lower-block {
        margin-top: 65px;
      }

      .band {
        padding: 0.8rem 0;
      }

      .band-inner {
        padding: 0 6vw;
      }

      .band-text {
        font-size: clamp(29px, 7vw, 38px);
        line-height: 1.1;
      }

      .locations {
        margin-top: 20px;
      }

      .fade-in {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }


    /* SMALL MOBILE */

    @media (max-width: 480px) {

      .page {
        padding-top: 4vh;
      }

      .profile {
        gap: 17px;
      }

      .profile-photo {
        width: 138px;
        height: 168px;
      }

      .profile-name {
        font-size: 24px;
      }

      .profile-role {
        font-size: 13px;
      }

      .lower-block {
        margin-top: 58px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <section class="hero">

      <div>

        <h1 class="title">
          THE<br>
          NEURO<br>
          CENTRE
        </h1>

        <div class="subtitle">
          NEUROFEEDBACK &amp; PSYCHOTHERAPY
        </div>

      </div>


      <div class="side">

        <div
          class="launch fade-in"
          id="locationBlock"
        >

          Neurofeedback &amp;<br>
          Psychotherapy in<br>

          <span class="city-highlight">
            Athlone
          </span>

        </div>


        <div
          class="profile fade-in"
          id="profileBlock"
        >

          <img
            src="Vanessa.jpeg"
            alt="Vanessa Wendt"
            class="profile-photo"
          >

          <div class="profile-text">

            <p class="profile-name">
              Vanessa Wendt
            </p>

            <p class="profile-role">
              Neurofeedback Psychotherapist
            </p>

            <a
              href="mailto:info@neurocentre.ie"
              class="contact-button"
            >
              Get in touch
            </a>

          </div>

        </div>

      </div>

    </section>


    <div class="lower-block">

      <section class="band">

        <div class="band-inner">

          <p class="band-text">
            Beyond words, regulation begins...
          </p>

        </div>

      </section>


      <section class="locations">

        <div>

          <h2 class="location-title">
            Athlone
          </h2>

          <p class="place">
            @ The Athlone Care Clinic
          </p>

        </div>

      </section>

    </div>

  </div>


  <script>

    if (window.innerWidth > 900) {

      setTimeout(() => {
        document
          .getElementById("locationBlock")
          .classList
          .add("visible");
      }, 700);

      setTimeout(() => {
        document
          .getElementById("profileBlock")
          .classList
          .add("visible");
      }, 1000);

    }

  </script>

</body>
</html>
