<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Neuro Centre</title>

  <link rel="icon" href="favicon.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,500;1,600&family=Libre+Franklin:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #f6f3ee;
      --text: #141414;
      --muted: #7a736a;
      --accent: #CC9F45;
      --border-dark: #2a2927;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Libre Franklin', sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: calc(4vh + 10px) 6vw 1.2vh 6vw;
    }

    /* HERO */

    .hero {
      display: grid;
      grid-template-columns: 1fr 480px;
      gap: 6vw;
      align-items: start;
    }

    /* LEFT */

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(95px, 11.5vw, 195px);
      line-height: 0.85;
      margin: 0 0 1.1rem 0;
    }

    .subtitle {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* RIGHT */

    .side {
      width: 480px;
      justify-self: end;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(40px);

      transition:
        opacity 0.8s ease-out,
        transform 0.8s ease-out;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .launch {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 3vw, 54px);
      line-height: 1.02;

      position: relative;
      top: 16px;
      left: 16px;

      margin: 0;
    }

    /* ATHLONE IMAGE */

    .city-highlight-image {
      display: block;

      width: 330px;
      max-width: 100%;
      height: auto;

      object-fit: contain;

      margin-top: 5px;
      margin-left: -15px;
    }

    /* PROFILE */

    .profile {
      display: flex;
      align-items: center;
      gap: 28px;

      position: relative;
      top: 0;
      left: 16px;

      margin-top: 10px;
    }

    .profile-photo {
      width: 190px;
      height: 225px;

      object-fit: cover;
      object-position: center top;

      border-radius: 20px;

      flex-shrink: 0;
    }

    .profile-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .profile-name {
      font-family: 'Bodoni Moda', serif;
      font-size: 34px;
      font-style: italic;
      font-weight: 500;

      line-height: 1;

      letter-spacing: -0.02em;
      word-spacing: -3px;

      margin: 0 0 10px -3px;

      white-space: nowrap;
    }

    .profile-role {
      font-family: 'Libre Franklin', sans-serif;

      font-size: 12px;
      font-style: normal;
      font-weight: 400;

      letter-spacing: 0.10em;
      text-transform: uppercase;

      line-height: 1.4;

      color: var(--accent);

      margin: 0 0 20px 0;

      white-space: nowrap;
    }

    .mobile-break {
      display: none;
    }

    /* GET IN TOUCH */

    .contact-button {
      display: inline-block;

      padding: 13px 24px;

      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;

      font-family: 'Libre Franklin', sans-serif;
      font-size: 14px;
      font-weight: 500;

      color: #ffffff;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .contact-button:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }

    /* LOWER */

    .lower-block {
      margin-top: 115px;
    }

    /* GOLD BAND */

    .band {
      position: relative;

      left: 50%;
      margin-left: -50vw;

      width: 100vw;

      background: var(--accent);

      padding: 0.95rem 0;
    }

    .band-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 6vw;
    }

    .band-text {
      font-family: 'Playfair Display', serif;

      font-size: clamp(30px, 3vw, 45px);

      font-style: italic;
      font-weight: 500;

      color: #29241f;

      margin: 0;

      line-height: 1.15;
    }

    /* CLINIC */

    .location-section {
      margin-top: 30px;
      padding-bottom: 55px;
    }

    .location-label {
      font-family: 'Libre Franklin', sans-serif;

      font-size: 12px;
      font-weight: 500;

      letter-spacing: 0.18em;
      text-transform: uppercase;

      color: var(--muted);

      margin: 0 0 6px 0;
    }

    .clinic-link {
      display: block;
      width: fit-content;

      font-family: 'Playfair Display', serif;

      font-size: 28px;
      font-weight: 500;

      line-height: 1.15;

      color: var(--text);

      text-decoration: none;

      transition: opacity 0.2s ease;
    }

    .clinic-link:hover {
      opacity: 0.72;
    }

    /* CALL BUTTON */

    .clinic-phone {
      display: inline-block;

      margin-top: 12px;

      padding: 11px 18px;

      border: 1px solid var(--border-dark);
      border-radius: 999px;

      background: transparent;

      font-family: 'Libre Franklin', sans-serif;
      font-size: 16px;
      font-weight: 600;

      color: var(--accent);

      text-decoration: none;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .clinic-phone:hover {
      background: rgba(204, 159, 69, 0.08);
      transform: translateY(-1px);
    }

    /* TABLET */

    @media (max-width: 1100px) {

      .hero {
        grid-template-columns: 1fr 410px;
      }

      .side {
        width: 410px;
      }

      .title {
        font-size: clamp(90px, 10.5vw, 180px);
      }

      .city-highlight-image {
        width: 290px;
      }

      .profile {
        margin-top: 8px;
      }

      .profile-photo {
        width: 170px;
        height: 205px;
      }

      .profile-name {
        font-size: 31px;
      }
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .page {
        padding: 4vh 6vw 3vh 6vw;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .side {
        width: 100%;
        max-width: 440px;
        justify-self: start;
      }

      .title {
        font-size: clamp(70px, 18vw, 130px);
      }

      .subtitle {
        font-size: 11px;
        line-height: 1.45;
        letter-spacing: 0.14em;

        max-width: 100%;
        white-space: normal;
      }

      .launch {
        top: 0;
        left: 0;
      }

      .city-highlight-image {
        width: min(330px, 92vw);

        margin-top: 3px;
        margin-left: -10px;
      }

      .profile {
        top: 0;
        left: 0;

        margin-top: 22px;

        gap: 16px;

        align-items: flex-end;
      }

      .profile-photo {
        width: 145px;
        height: 175px;

        border-radius: 18px;
      }

      .profile-name {
        font-size: 24px;

        letter-spacing: -0.03em;
        word-spacing: -3px;

        margin-left: -3px;
      }

      .profile-role {
        font-size: 10px;
        letter-spacing: 0.07em;
        line-height: 1.5;

        white-space: normal;
      }

      .mobile-break {
        display: inline;
      }

      .contact-button {
        padding: 11px 19px;
        font-size: 13px;
      }

      .lower-block {
        margin-top: 62px;
      }

      .band {
        padding: 0.8rem 0;
      }

      .band-inner {
        padding: 0 6vw;
      }

      .band-text {
        font-size: clamp(29px, 7vw, 38px);
        line-height: 1.1;
      }

      .location-section {
        margin-top: 26px;
        padding-bottom: 45px;
      }

      .location-label {
        font-size: 11px;
      }

      .clinic-link {
        font-size: 26px;
      }

      .clinic-phone {
        margin-top: 11px;
        padding: 11px 17px;
        font-size: 15px;
      }

      .fade-in {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }

    /* SMALL MOBILE */

    @media (max-width: 480px) {

      .page {
        padding-top: 3vh;
      }

      .profile {
        gap: 14px;
        margin-top: 18px;
      }

      .profile-photo {
        width: 138px;
        height: 168px;
      }

      .profile-name {
        font-size: 22px;

        letter-spacing: -0.03em;
        word-spacing: -3px;

        margin-left: -3px;
      }

      .profile-role {
        font-size: 9px;
        letter-spacing: 0.05em;
        line-height: 1.5;
      }

      .contact-button {
        padding: 10px 17px;
        font-size: 12px;
      }

      .lower-block {
        margin-top: 56px;
      }

      .clinic-link {
        font-size: 24px;
      }

      .clinic-phone {
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <section class="hero">

      <div>

        <h1 class="title">
          THE<br>
          NEURO<br>
          CENTRE
        </h1>

        <div class="subtitle">
          NEUROFEEDBACK &amp; PSYCHOTHERAPY
        </div>

      </div>

      <div class="side">

        <div
          class="launch fade-in"
          id="locationBlock"
        >

          Neurofeedback &amp;<br>
          Psychotherapy in

          <img
            src="Athlone.png"
            alt="Athlone"
            class="city-highlight-image"
          >

        </div>

        <div
          class="profile fade-in"
          id="profileBlock"
        >

          <img
            src="Vanessa.jpeg"
            alt="Vanessa Wendt"
            class="profile-photo"
          >

          <div class="profile-text">

            <p class="profile-name">
              Vanessa Wendt
            </p>

            <p class="profile-role">
              Neurofeedback<span class="mobile-break"><br></span> Psychotherapist
            </p>

            <a
              href="mailto:vanessa@neurocentre.ie"
              class="contact-button"
            >
              Get in touch
            </a>

          </div>

        </div>

      </div>

    </section>

    <div class="lower-block">

      <section class="band">

        <div class="band-inner">

          <p class="band-text">
            Beyond words, regulation begins...
          </p>

        </div>

      </section>

      <section class="location-section">

        <p class="location-label">
          Based at
        </p>

        <a
          class="clinic-link"
          href="https://www.google.com/maps/search/?api=1&query=Athlone+Care+Clinic"
          target="_blank"
          rel="noopener noreferrer"
        >
          Athlone Care Clinic
        </a>

        <a
          class="clinic-phone"
          href="tel:+353906455302"
        >
          Call 090 645 5302
        </a>

      </section>

    </div>

  </div>

  <script>

    if (window.innerWidth > 900) {

      setTimeout(() => {
        document
          .getElementById("locationBlock")
          .classList
          .add("visible");
      }, 700);

      setTimeout(() => {
        document
          .getElementById("profileBlock")
          .classList
          .add("visible");
      }, 1000);

    }

  </script>

</body>
</html>
