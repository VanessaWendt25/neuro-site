<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Neuro Centre</title>

  <link rel="icon" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f3ee;
      --text: #141414;
      --muted: #756f67;
      --accent: #cdb58f;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: calc(4vh + 10px) 6vw 1.2vh 6vw;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 470px;
      gap: 6vw;
      align-items: start;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(95px, 11.5vw, 195px);
      line-height: 0.85;
      margin: 0 0 1.1rem 0;
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .side {
      width: 470px;
      justify-self: end;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .launch {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 3vw, 54px);
      line-height: 1.02;
      position: relative;
      top: 16px;
      left: 16px;
      margin: 0;
    }

    .city-highlight {
      display: inline-block;
      font-family: 'Allura', cursive;
      font-size: 1.75em;
      font-weight: 400;
      line-height: 0.85;
      color: var(--accent);
      margin-top: 8px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 26px;
      position: relative;
      top: 54px;
      left: 16px;
    }

    .profile-photo {
      width: 175px;
      height: 210px;
      object-fit: cover;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .profile-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .profile-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.05;
      margin: 0 0 5px 0;
    }

    .profile-role {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.25;
      color: var(--muted);
      margin: 0 0 20px 0;
    }

    .contact-button {
      display: inline-block;
      padding: 12px 22px;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;

      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 600;

      color: #ffffff;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .contact-button:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }

    .lower-block {
      margin-top: 150px;
    }

    .band {
      position: relative;
      left: 50%;
      margin-left: -50vw;
      width: 100vw;
      background: var(--accent);
      padding: 0.9rem 0;
    }

    .band-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 6vw;
    }

    .band-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(30px, 3vw, 45px);
      font-style: italic;
      font-weight: 500;
      color: #2b2723;
      margin: 0;
      line-height: 1.15;
    }

    .locations {
      margin-top: 22px;
    }

    .location-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin: 0 0 2px 0;
    }

    .place {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: var(--accent);
      margin: 0;
    }

    @media (max-width: 1100px) {
      .hero {
        grid-template-columns: 1fr 410px;
      }

      .side {
        width: 410px;
      }

      .title {
        font-size: clamp(90px, 10.5vw, 180px);
      }

      .profile-photo {
        width: 155px;
        height: 186px;
      }
    }

    @media (max-width: 900px) {
      .page {
        padding: 6vh 6vw 4vh 6vw;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .side {
        width: 100%;
        max-width: 420px;
        justify-self: start;
      }

      .title {
        font-size: clamp(70px, 18vw, 130px);
      }

      .launch {
        top: 0;
        left: 0;
      }

      .city-highlight {
        font-size: 1.65em;
      }

      .profile {
        top: 28px;
        left: 0;
        gap: 17px;
      }

      .profile-photo {
        width: 82px;
        height: 100px;
        border-radius: 16px;
      }

      .profile-name {
        font-size: 24px;
      }

      .profile-role {
        font-size: 15px;
        margin-bottom: 12px;
      }

      .contact-button {
        padding: 9px 17px;
        font-size: 15px;
      }

      .lower-block {
        margin-top: 85px;
      }

      .fade-in {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="page">
    <section class="hero">

      <div>
        <h1 class="title">
          THE<br>NEURO<br>CENTRE
        </h1>

        <div class="subtitle">
          NEUROFEEDBACK &amp; PSYCHOTHERAPY
        </div>
      </div>

      <div class="side">

        <div class="launch fade-in" id="locationBlock">
          Neurofeedback &amp;<br>
          Psychotherapy in<br>
          <span class="city-highlight">Athlone</span>
        </div>

        <div class="profile fade-in" id="profileBlock">

          <img
            src="Vanessa.jpeg"
            alt="Vanessa Wendt"
            class="profile-photo"
          >

          <div class="profile-text">
            <p class="profile-name">Vanessa Wendt</p>

            <p class="profile-role">
              Neurofeedback Psychotherapist
            </p>

            <a
              href="mailto:info@neurocentre.ie"
              class="contact-button"
            >
              Get in touch
            </a>
          </div>

        </div>

      </div>
    </section>

    <div class="lower-block">

      <section class="band">
        <div class="band-inner">
          <p class="band-text">
            Beyond words, regulation begins...
          </p>
        </div>
      </section>

      <section class="locations">
        <div>
          <h2 class="location-title">Athlone</h2>
          <p class="place">@ The Athlone Care Clinic</p>
        </div>
      </section>

    </div>
  </div>

  <script>
    if (window.innerWidth > 900) {

      setTimeout(() => {
        document
          .getElementById("locationBlock")
          .classList.add("visible");
      }, 700);

      setTimeout(() => {
        document
          .getElementById("profileBlock")
          .classList.add("visible");
      }, 1000);

    }
  </script>

</body>
</html>
